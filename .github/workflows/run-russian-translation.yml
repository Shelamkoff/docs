name: Run Russian documentation rebuild

on:
  push:
    branches:
      - '3.16'
    paths:
      - .github/workflows/run-russian-translation.yml
  pull_request:
    branches:
      - '3.16'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: russian-documentation-rebuild
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out translation branch
        uses: actions/checkout@v4
        with:
          ref: agent/russian-translation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore translation script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .github/scripts
          gh api repos/${{ github.repository }}/git/blobs/1ed1cadecc981bededcb237054b71a6a9e1045fc --jq .content \
            | tr -d '\n' \
            | base64 --decode \
            > .github/scripts/translate_docs_ru.py
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/translate_docs_ru.py')
          text = path.read_text()
          text = text.replace(
              'PLACEHOLDER_RE = re.compile(r"ZXQ[A-F0-9]{12}QXZ")',
              'PLACEHOLDER_RE = re.compile(r"zxq[a-f0-9]{12}qxz")',
          )
          text = text.replace(
              'token = "ZXQ" + hashlib.sha1(value.encode("utf-8")).hexdigest()[:12].upper() + "QXZ"',
              'token = "zxq" + hashlib.sha1(value.encode("utf-8")).hexdigest()[:12] + "qxz"',
          )
          path.write_text(text)
          PY
          python -m py_compile .github/scripts/translate_docs_ru.py

      - name: Install translation engine
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install argostranslate==1.9.6

      - name: Rebuild Russian documentation
        run: python .github/scripts/translate_docs_ru.py

      - name: Validate repository diff
        run: |
          git diff --check
          test -f docs/ru/manifest.json
          python -m json.tool docs/ru/manifest.json >/dev/null
          python -m json.tool languages.json >/dev/null

      - name: Commit generated localization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/translate-docs-ru.yml
          git add -A docs/ru languages.json context.yaml .github/workflows/translate-docs-ru.yml
          git commit -m 'Complete Russian documentation translation'
          git push origin HEAD:agent/russian-translation
